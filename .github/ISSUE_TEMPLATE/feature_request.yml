name: Feature Request
description: Suggest an idea or enhancement for AssetPulse
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea to make AssetPulse better!
  - type: input
    id: feature-title
    attributes:
      label: Feature Title
      description: A concise title for your proposal.
      placeholder: e.g., Support recurring deposits (RD) tracking
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / User Experience
      description: Describe what you would like to happen and how the interface/feature should look.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
