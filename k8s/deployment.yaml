apiVersion: v1
kind: Namespace
metadata:
  name: assetpulse
---
apiVersion: v1
kind: Secret
metadata:
  name: assetpulse-secret
  namespace: assetpulse
type: Opaque
stringData:
  # Replace with your MySQL credentials.
  # IMPORTANT: If your password contains special characters like '@', '#', ':', or '/',
  # they MUST be URL-encoded (e.g. '@' -> '%40', '#' -> '%23', '!' -> '%21').
  # AssetPulse automatically tunes connect_timeout=30 & pool_timeout=30 if not provided.
  DATABASE_URL: "mysql://username:password@mysql-host-or-ip:3306/fintrack"
  # Generate a 32+ character random string (e.g., openssl rand -hex 32)
  JWT_SECRET: "replace-with-a-very-secure-32-char-random-jwt-secret-key"
  NEXTAUTH_SECRET: "replace-with-a-very-secure-32-char-random-jwt-secret-key"
  # Bearer/header token protecting the daily maturity scan endpoint (/api/cron/maturity-check)
  CRON_SECRET: "replace-with-a-very-secure-32-char-random-jwt-secret-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: assetpulse-config
  namespace: assetpulse
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_TYPE: "mysql"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetpulse
  namespace: assetpulse
  labels:
    app: assetpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assetpulse
  template:
    metadata:
      labels:
        app: assetpulse
    spec:
      containers:
        - name: assetpulse
          image: ghcr.io/vaibhavpotdar911/assetpulse-financial-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: assetpulse-config
            - secretRef:
                name: assetpulse-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: assetpulse-service
  namespace: assetpulse
spec:
  type: ClusterIP
  selector:
    app: assetpulse
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# Optional Ingress (enable and adjust host/ingressClassName as per your cluster)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assetpulse-ingress
  namespace: assetpulse
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx # or traefik / alb
  rules:
    - host: fintrack.local # or your domain: e.g. fintrack.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assetpulse-service
                port:
                  number: 80
---
# ==============================================================================
# Daily Automated Maturity & Notification CronJob
# Runs cross-tenant maturity checks daily at 04:00 UTC (09:30 AM IST)
# Dispatches notifications and emails configured in user settings
# ==============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: assetpulse-maturity-cron
  namespace: assetpulse
  labels:
    app: assetpulse-cron
spec:
  schedule: "0 4 * * *" # Runs daily at 04:00 AM UTC (adjust to your preferred time)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: assetpulse-cron
        spec:
          restartPolicy: OnFailure
          containers:
            - name: maturity-scanner
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - >
                  echo "[$(date -u)] Initiating AssetPulse daily maturity scan...";
                  RESPONSE=$(curl -fsS -X POST "http://assetpulse-service.assetpulse.svc.cluster.local/api/cron/maturity-check?secret=${CRON_SECRET}" \
                    -H "x-cron-secret: ${CRON_SECRET}" \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    -w "\nHTTP_STATUS:%{http_code}\n");
                  echo "$RESPONSE";
                  if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
                    echo "[$(date -u)] Daily maturity scan and notification dispatch succeeded.";
                    exit 0;
                  else
                    echo "[$(date -u)] Daily maturity scan failed.";
                    exit 1;
                  fi
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: assetpulse-secret
                      key: CRON_SECRET

