apiVersion: v1
kind: Namespace
metadata:
  name: assetpulse
---
apiVersion: v1
kind: Secret
metadata:
  name: assetpulse-secret
  namespace: assetpulse
type: Opaque
stringData:
  # Replace with your MySQL credentials (URL-encoded password if it has special characters)
  DATABASE_URL: "mysql://username:password@mysql-host-or-ip:3306/fintrack"
  # Generate a 32+ character random string (e.g., openssl rand -hex 32)
  JWT_SECRET: "replace-with-a-very-secure-32-char-random-jwt-secret-key"
  NEXTAUTH_SECRET: "replace-with-a-very-secure-32-char-random-jwt-secret-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: assetpulse-config
  namespace: assetpulse
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_TYPE: "mysql"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetpulse
  namespace: assetpulse
  labels:
    app: assetpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assetpulse
  template:
    metadata:
      labels:
        app: assetpulse
    spec:
      containers:
        - name: assetpulse
          image: ghcr.io/vaibhavpotdar911/assetpulse-financial-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: assetpulse-config
            - secretRef:
                name: assetpulse-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: assetpulse-service
  namespace: assetpulse
spec:
  type: ClusterIP
  selector:
    app: assetpulse
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# Optional Ingress (enable and adjust host/ingressClassName as per your cluster)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assetpulse-ingress
  namespace: assetpulse
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx # or traefik / alb
  rules:
    - host: fintrack.local # or your domain: e.g. fintrack.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assetpulse-service
                port:
                  number: 80
