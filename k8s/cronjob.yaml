apiVersion: batch/v1
kind: CronJob
metadata:
  name: assetpulse-maturity-cron
  namespace: assetpulse
  labels:
    app: assetpulse-cron
spec:
  # Runs daily at 01:30 AM UTC (07:00 AM IST).
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: assetpulse-cron
        spec:
          restartPolicy: OnFailure
          containers:
            - name: maturity-scanner
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - >
                  echo "[$(date -u)] Initiating AssetPulse daily maturity scan (7:00 AM IST schedule)...";
                  TARGET_URL="http://assetpulse-service.assetpulse.svc.cluster.local/api/cron/maturity-check";
                  if ! curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 "http://assetpulse-service/api/health/db" 2>/dev/null | grep -q "[0-9]"; then
                    if curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 "http://assetpulse:3000/api/health/db" 2>/dev/null | grep -q "[0-9]"; then
                      TARGET_URL="http://assetpulse:3000/api/cron/maturity-check";
                    fi;
                  else
                    TARGET_URL="http://assetpulse-service/api/cron/maturity-check";
                  fi;
                  echo "Target endpoint: ${TARGET_URL}";
                  TOKEN="${CRON_SECRET:-}";
                  RESPONSE=$(curl -sS -X POST "${TARGET_URL}?secret=${TOKEN}" \
                    -H "x-cron-secret: ${TOKEN}" \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -w "\nHTTP_STATUS:%{http_code}\n");
                  echo "Response from AssetPulse:";
                  echo "$RESPONSE";
                  if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
                    echo "[$(date -u)] Daily maturity scan and notification dispatch succeeded.";
                    exit 0;
                  else
                    echo "[$(date -u)] Daily maturity scan failed. Check HTTP_STATUS and response above.";
                    exit 1;
                  fi
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: assetpulse-secret
                      key: CRON_SECRET
                      optional: true
