version: '3.8'

services:
  assetpulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/vaibhavpotdar911/assetpulse-financial-tracker:latest
    container_name: assetpulse
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_TYPE=sqlite
      - DATABASE_URL=file:/app/data/fintrack.db
      - JWT_SECRET=change-this-to-a-very-secure-32-character-secret-key!
      - NEXTAUTH_SECRET=change-this-to-a-very-secure-32-character-secret-key!
    volumes:
      - assetpulse_data:/app/data

volumes:
  assetpulse_data:
