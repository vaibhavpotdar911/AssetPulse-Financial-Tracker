<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with metallic dark border -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle grid lines -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
  <line x1="50" y1="20" x2="50" y2="80" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Glow under the pulse -->
  <path d="M16 56 L30 56 L40 68 L52 26 L62 62 L70 46 L84 46" 
        stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#glow)" />

  <!-- Main Financial Pulse Vector -->
  <path d="M16 56 L30 56 L40 68 L52 26 L62 62 L70 46 L84 46" 
        stroke="url(#pulseGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Data Nodes -->
  <circle cx="52" cy="26" r="4.5" fill="#FFFFFF" stroke="#22C55E" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="84" cy="46" r="3" fill="#22C55E" />
  <circle cx="16" cy="56" r="2.5" fill="#06B6D4" />
</svg>
